<!doctype html>
<!--
  The README / settings-page illustration: Search in files.
  Drawn, not captured — invented project data, so no real repository or thread
  titles appear in it. Regenerate after a layout change:
    chrome --headless=new --force-device-scale-factor=2 --window-size=1400,720 \
      --screenshot=docs/preview.png file://$PWD/docs/preview.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #1b1f24; --panel: #22272e; --recessed: #1c2128; --border: #343941;
        --fg: #cdd9e5; --muted: #7d8590; --accent: #4184e4; --sel: #2d333b;
        --kw: #f47067; --str: #96d0ff; --fn: #dcbdfb; --num: #6cb6ff; --com: #768390;
        --mono: "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
        --ui: -apple-system, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { width: 1400px; height: 720px; background: var(--bg); color: var(--fg);
             font-family: var(--ui); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
      svg { display: block; flex: none; }
      .titlebar { height: 44px; flex: none; display: flex; align-items: center; gap: 9px; padding: 0 14px;
                  border-bottom: 1px solid var(--border); background: var(--panel); }
      .titlebar .name { font-size: 13.5px; font-weight: 600; }
      .body { flex: 1; display: flex; min-height: 0; }

      .explorer { width: 360px; flex: none; display: flex; flex-direction: column;
                  background: var(--recessed); border-right: 1px solid var(--border); }
      .pickers { padding: 10px 10px 6px; display: flex; flex-direction: column; gap: 6px; }
      .select { height: 30px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel);
                display: flex; align-items: center; gap: 7px; padding: 0 8px; font-size: 12.5px; }
      .select .chev { margin-left: auto; color: var(--muted); }
      .searchrow { padding: 2px 10px 8px; display: flex; align-items: center; gap: 4px; }
      .field { flex: 1; position: relative; height: 30px; border: 1px solid var(--accent); border-radius: 6px;
               background: var(--panel); display: flex; align-items: center; gap: 7px; padding: 0 8px; font-size: 12.5px; }
      .toggles { margin-left: auto; display: flex; gap: 2px; }
      .tg { width: 22px; height: 20px; display: grid; place-items: center; border-radius: 4px;
            font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
      .tg.on { background: #4184e433; color: var(--fg); box-shadow: inset 0 0 0 1px #4184e480; }
      .iconbtn { width: 26px; height: 26px; display: grid; place-items: center; color: var(--muted); border-radius: 5px; }

      .summary { display: flex; align-items: center; padding: 0 12px 6px; font-size: 11px; color: var(--muted); }
      .summary .right { margin-left: auto; }
      .results { flex: 1; overflow: hidden; }
      .fg { height: 24px; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 8px; font-size: 12.5px; white-space: nowrap; }
      .fg .fname { font-weight: 600; }
      .fg .dir { font-size: 10.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
      .badge { flex: none; border-radius: 999px; background: #ffffff14; padding: 0 6px; font-size: 10px; color: var(--muted); }
      .m { height: 22px; display: flex; align-items: center; gap: 9px; padding-left: 34px; padding-right: 12px;
           font-family: var(--mono); font-size: 11.5px; white-space: pre; overflow: hidden; color: #cdd9e5dd; }
      .m.on { background: var(--sel); }
      .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: pre; }
      .ln { width: 26px; flex: none; text-align: right; font-size: 10.5px; color: var(--muted); }
      .hit { background: #4184e44d; border-radius: 2px; color: var(--fg); }
      .foot { flex: none; height: 28px; display: flex; align-items: center; padding: 0 12px; font-size: 11px;
              color: var(--muted); border-top: 1px solid var(--border); }

      .editor { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      .tabs { height: 34px; flex: none; display: flex; border-bottom: 1px solid var(--border); background: var(--panel); }
      .tab { display: flex; align-items: center; gap: 6px; padding: 0 12px; font-size: 12.5px; color: var(--muted);
             border-right: 1px solid var(--border); }
      .tab.on { background: var(--bg); color: var(--fg); }
      .toolbar { height: 36px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px;
                 border-bottom: 1px solid var(--border); font-size: 11.5px; color: var(--muted); }
      .crumb b { color: var(--fg); font-weight: 500; }
      .meta { margin-left: auto; font-size: 11px; }
      .seg { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: 6px; }
      .seg span { padding: 2px 7px; border-radius: 4px; font-size: 11px; }
      .seg .on { background: #ffffff14; color: var(--fg); }
      .code { flex: 1; display: flex; font-family: var(--mono); font-size: 12.5px; line-height: 20px; overflow: hidden; }
      .gut { width: 44px; flex: none; text-align: right; padding: 8px 10px 0 0; color: #57606a; }
      .src { flex: 1; padding: 8px 0 0 12px; white-space: pre; }
      .row { height: 20px; white-space: pre; }
      .hl { margin: 0 0 0 -12px; padding-left: 12px; background: #d2992226; box-shadow: inset 2px 0 0 #d29922; }
      .kw { color: var(--kw); } .str { color: var(--str); } .fn { color: var(--fn); } .num { color: var(--num); } .com { color: var(--com); }
    </style>
  </head>
  <body>
    <div class="titlebar">
      <svg width="17" height="17" viewBox="0 0 24 24"><g fill="none" stroke="#cdd9e5" stroke-width="1.6" stroke-linejoin="round"><rect x="2.5" y="3.5" width="19" height="17" rx="2.5"/><path d="M9.5 3.5v17"/></g><g fill="#cdd9e5"><rect x="5.1" y="7.4" width="2.6" height="1.5" rx=".75"/><rect x="5.1" y="11.25" width="2.6" height="1.5" rx=".75"/><rect x="5.1" y="15.1" width="2.6" height="1.5" rx=".75"/><rect x="11.5" y="7.4" width="7.4" height="1.5" rx=".75"/><rect x="11.5" y="11.25" width="5.2" height="1.5" rx=".75"/><rect x="11.5" y="15.1" width="6.6" height="1.5" rx=".75"/></g></svg>
      <span class="name">Files</span>
    </div>
    <div class="body">
      <div class="explorer">
        <div class="pickers">
          <div class="select"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7d8590" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>acme-shop<svg class="chev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></div>
          <div class="select"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7d8590" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M8.5 6H14a4 4 0 0 1 4 4v.5"/></svg>feature/cart<svg class="chev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></div>
        </div>
        <div class="searchrow">
          <div class="field">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7d8590" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <span>discount</span>
            <div class="toggles"><span class="tg">Aa</span><span class="tg" style="text-decoration:underline;text-underline-offset:2px">ab</span><span class="tg">.*</span></div>
          </div>
          <span class="iconbtn" title="Go to file by name"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
          <span class="iconbtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg></span>
          <span class="iconbtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg></span>
        </div>
        <div class="summary"><span>24 results in 5 files</span><span class="right">Collapse all</span></div>
        <div class="results" id="results"></div>
        <div class="foot">1,284 files</div>
      </div>

      <div class="editor">
        <div class="tabs">
          <div class="tab on"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6cb6ff" stroke-width="1.8"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>cart.ts<span style="margin-left:4px">×</span></div>
          <div class="tab"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7d8590" stroke-width="1.8"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>pricing.ts<span style="margin-left:4px">×</span></div>
        </div>
        <div class="toolbar">
          <span class="crumb">acme-shop &nbsp;›&nbsp; src &nbsp;›&nbsp; lib &nbsp;›&nbsp; <b>cart.ts</b></span>
          <span class="meta">TypeScript · 212 lines · 6.1 KB</span>
          <span class="seg"><span class="on">Read</span><span>Edit</span></span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </div>
        <div class="code"><div class="gut" id="gut"></div><div class="src" id="src"></div></div>
      </div>
    </div>
    <script>
      const glyph = (c) => `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.7"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>`;
      const chev = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#7d8590" stroke-width="2.6"><path d="M6 9l6 6 6-6"/></svg>';
      const h = (s) => s.replace(/discount/gi, (m) => `<span class="hit">${m}</span>`);
      const groups = [
        ["cart.ts", "src/lib", "#6cb6ff", 11, [[7, "// Applies a percentage discount to the cart subtotal."], [13, "* Takes the discount off the subtotal, never below zero."], [14, "* A zero or negative discount leaves the subtotal alone."], [16, "export function applyDiscount(subtotal: Money, discount: Percent): Money {", true], [17, "if (discount &lt;= 0) return subtotal;"], [18, "const off = subtotal.times(discount / 100);"], [24, "return applyDiscount(gross, item.discount);"], [29, "return applyDiscount(sum(items), cart.discount);"]]],
        ["pricing.ts", "src/lib", "#6cb6ff", 5, [[7, "const MAX_DISCOUNT = 90;"], [22, "export function clampDiscount(discount: number) {"], [23, "return Math.min(discount, MAX_DISCOUNT);"]]],
        ["CartSummary.tsx", "src/components", "#6cb6ff", 4, [[31, "&lt;Row label=\"Discount\" value={discount} /&gt;"], [48, "const discount = useDiscount(cart);"]]],
        ["cart.test.ts", "tests", "#6cb6ff", 3, [[12, "it(\"ignores a zero discount\", () =&gt; {"], [19, "expect(applyDiscount(price, discount)).toEqual(price);"]]],
        ["README.md", "", "#57ab5a", 1, [[58, "A cart-wide discount is applied after line items."]]],
      ];
      document.getElementById("results").innerHTML = groups.map(([name, dir, color, count, rows]) =>
        `<div class="fg">${chev}${glyph(color)}<span class="fname">${name}</span><span class="dir">${dir}</span><span class="badge">${count}</span></div>` +
        rows.map(([ln, text, on]) => `<div class="m${on ? " on" : ""}"><span class="ln">${ln}</span><span class="t">${h(text)}</span></div>`).join("")
      ).join("");

      const code = [
        ["com", "// Applies a percentage discount to the cart subtotal."],
        ["", "<span class='kw'>import</span> { Money, Percent } <span class='kw'>from</span> <span class='str'>\"./money\"</span>;"],
        ["", ""],
        ["", "<span class='kw'>export const</span> EMPTY_CART = { items: [], currency: <span class='str'>\"USD\"</span> };"],
        ["", ""],
        ["com", "/**"],
        ["com", " * Takes the discount off the subtotal, never below zero."],
        ["com", " * A zero or negative discount leaves the subtotal alone."],
        ["com", " */"],
        ["", "<span class='kw'>export function</span> <span class='fn'>applyDiscount</span>(subtotal: <span class='fn'>Money</span>, discount: <span class='fn'>Percent</span>): <span class='fn'>Money</span> {", true],
        ["", "  <span class='kw'>if</span> (discount &lt;= <span class='num'>0</span>) <span class='kw'>return</span> subtotal;"],
        ["", "  <span class='kw'>const</span> off = subtotal.<span class='fn'>times</span>(discount / <span class='num'>100</span>);"],
        ["", "  <span class='kw'>return</span> subtotal.<span class='fn'>minus</span>(off).<span class='fn'>clampAtZero</span>();"],
        ["", "}"],
        ["", ""],
        ["", "<span class='kw'>export function</span> <span class='fn'>lineTotal</span>(item: <span class='fn'>LineItem</span>): <span class='fn'>Money</span> {"],
        ["", "  <span class='kw'>const</span> gross = item.unitPrice.<span class='fn'>times</span>(item.quantity);"],
        ["", "  <span class='kw'>return</span> <span class='fn'>applyDiscount</span>(gross, item.discount);"],
        ["", "}"],
        ["", ""],
        ["", "<span class='kw'>export function</span> <span class='fn'>cartTotal</span>(cart: <span class='fn'>Cart</span>): <span class='fn'>Money</span> {"],
        ["", "  <span class='kw'>const</span> items = cart.items.<span class='fn'>map</span>(lineTotal);"],
        ["", "  <span class='kw'>return</span> <span class='fn'>applyDiscount</span>(<span class='fn'>sum</span>(items), cart.discount);"],
        ["", "}"],
      ];
      const first = 7;
      document.getElementById("gut").innerHTML = code.map((_, i) => `<div class="row">${first + i}</div>`).join("");
      document.getElementById("src").innerHTML = code.map(([k, t, on]) => {
        const inner = k === "com" ? `<span class="com">${t}</span>` : (t || "&nbsp;");
        return `<div class="row${on ? " hl" : ""}">${inner}</div>`;
      }).join("");
    </script>
  </body>
</html>
